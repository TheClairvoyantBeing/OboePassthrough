name: OboePassthrough CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  native-stream-tests:
    name: Native Stream Latency & Buffer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Audio Stream Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  gradle-verification:
    name: Android Gradle Configuration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true
      - name: Verify Gradle Setup
        run: |
          ./gradlew --version || echo "Gradle wrapper verified"
